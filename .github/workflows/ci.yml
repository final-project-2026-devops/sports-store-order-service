name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, test, build-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build-validate image (no push)
        run: docker build -t order-service:ci-validate .

  publish:
    name: Version bump + push to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for OIDC, once wired up
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No VERSION file committed back to the repo: main now requires a PR
      # (branch protection), so a direct `git push` from CI would fail.
      # run_number + short SHA is unique and monotonically increasing per
      # branch without needing to write back to git.
      - name: Compute image tag
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=0.${{ github.run_number }}.0-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # Never push :latest — the tag above is always <semver>-<7-char-hash>.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977237815280:role/cloudcart-github-actions-cicd
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/sports-store-order-service:${{ steps.version.outputs.tag }} .
          docker push ${{ steps.ecr-login.outputs.registry }}/sports-store-order-service:${{ steps.version.outputs.tag }}
